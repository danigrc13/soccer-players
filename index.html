<script>
// ---------- CONEXION CON SUPABASE (Paso 2.4.1) ----------

// Datos del proyecto "ceoget-jugadores" (Project Settings > API en Supabase).
// La clave anon es publica por diseno: solo puede hacer lo que permitan las politicas de la tabla.
const SUPABASE_URL = "https://gifnyqivgylqmbeqdjxt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZm55cWl2Z3lscW1iZXFkanh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4Mzk3OTAsImV4cCI6MjEwOTQxNTc5MH0.bG44k140QRnLpA5Gx0oFyC5M3ztkRLzpVE3DKBIvmsk";

// "supabase" es el objeto global que trae el CDN; el cliente se llama distinto para no pisarlo.
const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Nombre de la tabla en Supabase y equipo por defecto para los jugadores nuevos.
const TABLA = "jugadores";
const EQUIPO_POR_DEFECTO = "FC Barcelona";

/// Ya no hay maximo de jugadores.
// const MAX_TITULARES = 11; // (eliminada, ya no se usa)

// Orden fijo en el que siempre se muestra la tabla, sin importar el orden en que se cargaron.
const ORDEN_POSICIONES = ["Portero", "Defensa", "Mediocampista", "Delantero"];

// Nombres en espanol -> nombre en ingles, que es como la API de banderas los conoce.
const TRADUCCIONES_PAIS = {
"espana": "Spain", "italia": "Italy", "alemania": "Germany", "brasil": "Brazil",
"francia": "France", "inglaterra": "United Kingdom", "polonia": "Poland",
"dinamarca": "Denmark", "portugal": "Portugal", "argentina": "Argentina",
"uruguay": "Uruguay", "mexico": "Mexico", "colombia": "Colombia", "chile": "Chile",
"paises bajos": "Netherlands", "holanda": "Netherlands", "belgica": "Belgium",
"croacia": "Croatia", "marruecos": "Morocco", "camerun": "Cameroon", "japon": "Japan"
};

// Cache de banderas ya consultadas, para no repetir llamadas a la API.
let banderaCache = {};

// Mientras esta en null, el formulario esta en modo "agregar".
// Si tiene un numero, el formulario esta en modo "editar" ese indice del array.
let indiceEnEdicion = null;

// Filtro de posicion actualmente seleccionado ("Todas" muestra a todos).
let filtroPosicionActual = "Todas";

// Indice de la fila (jugador) actualmente seleccionada en la tabla, o null si ninguna.
let filaSeleccionada = null;

// Datos de un JSON ya leido, pendientes de confirmacion en la vista previa.
let datosJsonPendientes = null;

// Copia local de lo que hay en Supabase. Se llena con cargarDesdeSupabase().
let PLAYERS = [];

// ---------- CONVERSION ENTRE LA PAGINA Y LA TABLA ----------

// La pagina trabaja con {numero, name, nationality, position, age, equipo}
// y la tabla de Supabase usa columnas en espanol. Estas dos funciones traducen entre ambas.
// "numero" de la pagina = "identificacion" de la tabla (es la llave primaria).
function desdeBD(fila)
{
return {
"numero": String(fila.identificacion),
"name": fila.nombre,
"nationality": fila.nacionalidad,
"position": fila.posicion,
"age": fila.edad,
"equipo": fila.equipo
};
}

function haciaBD(j)
{
return {
"identificacion": String(j.numero),
"nombre": j.name,
"edad": Number(j.age),
"posicion": j.position,
"equipo": j.equipo || EQUIPO_POR_DEFECTO,
"nacionalidad": j.nationality
};
}

// Muestra un error de Supabase de forma legible.
function mostrarErrorSupabase(accion, error)
{
alert("No se pudo " + accion + " en Supabase.\n\nDetalle: " + error.message);
}

// FUNCION INICIAL: se ejecuta al cargar la pagina.
window.onload = async function ()
{
// PROTECCION: si no hay una sesion iniciada en Supabase, se vuelve a login.html.
const { data } = await clienteSupabase.auth.getSession();
if (!data.session)
{
location.replace("login.html");
return;
}
// Hay sesion: se muestra la pagina.
document.querySelector("#ocultarHastaSesion").remove();

buildTable();

document.querySelector("#botonAgregarNuevo").addEventListener("click", mostrarFormularioParaAgregar);
document.querySelector("#botonGuardarJugador").addEventListener("click", guardarJugador);
document.querySelector("#botonCancelar").addEventListener("click", ocultarFormulario);
document.querySelector("#buscador").addEventListener("input", buildTable);
document.querySelector("#inputTxt").addEventListener("change", importarDesdeTxt);
document.querySelector("#botonBorrarTodo").addEventListener("click", borrarTodo);
document.querySelector("#botonCerrarSesion").addEventListener("click", cerrarSesion);

// Boton "Cargar archivo": al hacer click muestra el menu con las 2 opciones (.txt / JSON).
document.querySelector("#botonCargarMenu").addEventListener("click", alternarMenuCargar);

// Opcion "Desde .txt": cierra el menu y abre el selector de archivo .txt (logica original, sin tocar).
document.querySelector("#opcionCargarTxt").addEventListener("click", function(evento)
{
evento.stopPropagation();
document.querySelector("#menuCargar").style.display = "none";
document.querySelector("#inputTxt").click();
});

// Opcion "Desde JSON": cierra el menu y abre el selector de archivo .json.
document.querySelector("#opcionCargarJson").addEventListener("click", function(evento)
{
evento.stopPropagation();
document.querySelector("#menuCargar").style.display = "none";
document.querySelector("#inputJson").click();
});

document.querySelector("#inputJson").addEventListener("change", importarDesdeJson);
document.querySelector("#botonConfirmarImportarJson").addEventListener("click", confirmarImportarJson);
document.querySelector("#botonCancelarImportarJson").addEventListener("click", cancelarImportarJson);
document.querySelector("#botonExportar").addEventListener("click", exportarJugadores);

// Boton "Ver JSON" y los botones de su ventana (Copiar, Descargar, Cerrar).
document.querySelector("#botonVerJson").addEventListener("click", mostrarJson);
document.querySelector("#botonCopiarJson").addEventListener("click", copiarJson);
document.querySelector("#botonDescargarJson").addEventListener("click", descargarJson);
document.querySelector("#botonCerrarJson").addEventListener("click", cerrarJson);
document.querySelector("#fondoModalVerJson").addEventListener("click", cerrarJson);

// Cierra el menu de carga si se hace click en cualquier otro lugar de la pagina.
document.addEventListener("click", function()
{
document.querySelector("#menuCargar").style.display = "none";
});

// Cada boton de pestana filtra por su posicion al hacer click.
document.querySelectorAll(".pestana").forEach(function(boton)
{
boton.addEventListener("click", function()
{
filtroPosicionActual = boton.dataset.posicion;
// Se le quita la clase "activa" a todas las pestanas, y se le pone solo a la elegida.
document.querySelectorAll(".pestana").forEach(b => b.classList.remove("activa"));
boton.classList.add("activa");
buildTable();
});
});

// Por ultimo se traen los jugadores desde Supabase.
cargarDesdeSupabase();
}

// ---------- CERRAR SESION ----------

// Cierra la sesion en Supabase y regresa a login.html.
async function cerrarSesion()
{
await clienteSupabase.auth.signOut();
location.href = "login.html";
}

// ---------- LECTURA (SELECT) - Paso 2.4.2 ----------

// Trae todos los jugadores de la tabla y redibuja la pagina.
async function cargarDesdeSupabase()
{
const { data, error } = await clienteSupabase
.from(TABLA)
.select("*")
.order("created_at", { ascending: true });

if (error)
{
mostrarErrorSupabase("cargar los jugadores", error);
return;
}

PLAYERS = data.map(desdeBD);
buildTable();
}

// Abre el formulario vacio, listo para cargar un jugador nuevo.
function mostrarFormularioParaAgregar()
{
indiceEnEdicion = null;
document.querySelector("#tituloFormulario").innerText = "Agregar nuevo jugador";
document.querySelector("#newNumero").value = "";
document.querySelector("#newName").value = "";
document.querySelector("#newNationality").value = "";
document.querySelector("#newPosition").value = "Delantero";
document.querySelector("#newAge").value = "";
document.querySelector("#formularioJugador").style.display = "block";
document.querySelector("#fondoModalJugador").style.display = "block";
}

// Abre el formulario, pero ya con los datos de un jugador existente (para editarlo).
function editarJugador(indice)
{
indiceEnEdicion = indice;
let j = PLAYERS[indice];
document.querySelector("#tituloFormulario").innerText = "Editar jugador";
document.querySelector("#newNumero").value = j.numero;
document.querySelector("#newName").value = j.name;
document.querySelector("#newNationality").value = j.nationality;
document.querySelector("#newPosition").value = j.position;
document.querySelector("#newAge").value = j.age;
document.querySelector("#formularioJugador").style.display = "block";
document.querySelector("#fondoModalJugador").style.display = "block";
}

// Cierra el formulario sin guardar nada.
function ocultarFormulario()
{
document.querySelector("#formularioJugador").style.display = "none";
document.querySelector("#fondoModalJugador").style.display = "none";
}

// ---------- ELIMINACION (DELETE) - Paso 2.4.4 ----------

// Elimina a un jugador de Supabase, pidiendo confirmacion antes.
async function eliminarJugador(indice)
{
let nombre = PLAYERS[indice].name;
let confirmar = confirm("Seguro que deseas eliminar a " + nombre + "?");
if (!confirmar) return;

const { error } = await clienteSupabase
.from(TABLA)
.delete()
.eq("identificacion", PLAYERS[indice].numero);

if (error)
{
mostrarErrorSupabase("eliminar el jugador", error);
return;
}

filaSeleccionada = null;
await cargarDesdeSupabase();
}

// Borra TODOS los jugadores de la tabla, pidiendo confirmacion antes.
async function borrarTodo()
{
if (PLAYERS.length === 0)
{
alert("No hay ningun jugador cargado.");
return;
}

let confirmar = confirm("Seguro que deseas eliminar TODOS los jugadores (" + PLAYERS.length + ")? Esta accion no se puede deshacer.");
if (!confirmar) return;

// Supabase exige un filtro en los DELETE; este abarca todas las filas.
const { error } = await clienteSupabase
.from(TABLA)
.delete()
.neq("identificacion", "");

if (error)
{
mostrarErrorSupabase("borrar los jugadores", error);
return;
}

filaSeleccionada = null;
await cargarDesdeSupabase();
}

// Marca (o desmarca si ya estaba) la fila elegida, al hacer clic sobre ella.
function seleccionarFila(indice)
{
filaSeleccionada = (filaSeleccionada === indice) ? null : indice;
buildTable();
}

// ---------- ESCRITURA / EDICION (INSERT / UPDATE) - Paso 2.4.3 ----------

// Valida el formulario y, segun el modo, inserta un jugador nuevo o actualiza uno existente.
async function guardarJugador()
{
let numero = document.querySelector("#newNumero").value;
let nombre = document.querySelector("#newName").value.trim();
let nacionalidad = document.querySelector("#newNationality").value.trim();
let posicion = document.querySelector("#newPosition").value;
let edad = document.querySelector("#newAge").value;

// Ningun campo puede quedar vacio.
if (numero === "" || nombre === "" || nacionalidad === "" || edad === "")
{
alert("Todos los campos son obligatorios.");
return;
}

// El numero de jugador debe ser numerico y mayor a 0.
if (isNaN(numero) || Number(numero) <= 0)
{
alert("El numero de jugador debe ser un valor numerico mayor a 0.");
return;
}

// El numero no se puede repetir (excepto consigo mismo, si se esta editando).
let numeroRepetido = PLAYERS.some(function(j, idx){
return j.numero == numero && idx !== indiceEnEdicion;
});
if (numeroRepetido)
{
alert("Ese numero de jugador ya esta en uso por otro jugador.");
return;
}

// La edad debe ser un numero, y estar en el rango permitido (15 a 50 anios).
if (isNaN(edad) || edad < 15 || edad > 50)
{
alert("La edad debe ser un numero entre 15 y 50 años.");
return;
}

let jugadorNuevo = {
"numero": numero,
"name": nombre,
"nationality": nacionalidad,
"position": posicion,
"age": Number(edad),
// Al editar se conserva el equipo que ya tenia; al agregar se usa el equipo por defecto.
"equipo": (indiceEnEdicion === null) ? EQUIPO_POR_DEFECTO : PLAYERS[indiceEnEdicion].equipo
};

let resultado;
if (indiceEnEdicion === null)
{
// Modo agregar: INSERT de una fila nueva.
resultado = await clienteSupabase
.from(TABLA)
.insert(haciaBD(jugadorNuevo));
}
else
{
// Modo editar: UPDATE de la fila que tenia la identificacion original.
resultado = await clienteSupabase
.from(TABLA)
.update(haciaBD(jugadorNuevo))
.eq("identificacion", PLAYERS[indiceEnEdicion].numero);
}

if (resultado.error)
{
mostrarErrorSupabase("guardar el jugador", resultado.error);
return;
}

ocultarFormulario();
await cargarDesdeSupabase();
}

// Valida un jugador leido de un archivo. Devuelve el motivo del rechazo, o null si es valido.
// "pendientes" son los jugadores del mismo archivo que ya pasaron, para no repetir numeros.
function validarJugadorImportado(j, pendientes)
{
let posicionesValidas = ["Portero", "Defensa", "Mediocampista", "Delantero"];

if (!j.numero || !j.name || !j.nationality || !j.position || j.age === "" || j.age === undefined || j.age === null)
return "faltan datos";

if (isNaN(j.numero) || Number(j.numero) <= 0)
return "numero invalido";

let repetido = PLAYERS.concat(pendientes).some(function(p){ return p.numero == j.numero; });
if (repetido)
return "numero " + j.numero + " ya esta en uso";

if (!posicionesValidas.includes(j.position))
return "posicion invalida (" + j.position + ")";

if (isNaN(j.age) || j.age < 15 || j.age > 50)
return "edad fuera de 15-50 (" + j.age + ")";

return null;
}

// Inserta en Supabase los jugadores validos de una importacion y muestra el resumen.
async function insertarImportados(nuevos, saltadas)
{
if (nuevos.length > 0)
{
const { error } = await clienteSupabase
.from(TABLA)
.insert(nuevos.map(haciaBD));

if (error)
{
mostrarErrorSupabase("importar los jugadores", error);
return;
}
}

await cargarDesdeSupabase();

let mensaje = nuevos.length + " jugador(es) importado(s) correctamente.";
if (saltadas.length > 0) mensaje += "\n\nSe saltaron " + saltadas.length + " fila(s):\n" + saltadas.join("\n");
alert(mensaje);
}

// ---------- CARGAR JUGADORES DESDE UN ARCHIVO .TXT ----------

// Se ejecuta cuando el usuario elige un archivo en el <input type="file">.
function importarDesdeTxt(evento)
{
let archivo = evento.target.files[0];
if (!archivo) return;

let lector = new FileReader();
lector.onload = async function(e)
{
// Cada linea del archivo es un jugador: numero,nombre,nacionalidad,posicion,edad
let lineas = e.target.result.split(/\r?\n/).filter(function(l){ return l.trim() !== ""; });

let nuevos = [];
let saltadas = [];

lineas.forEach(function(linea)
{
let partes = linea.split(",").map(function(p){ return p.trim(); });
let j = {
"numero": partes[0],
"name": partes[1],
"nationality": partes[2],
"position": partes[3],
"age": partes[4],
"equipo": EQUIPO_POR_DEFECTO
};

let motivo = validarJugadorImportado(j, nuevos);
if (motivo)
{
saltadas.push((j.name || "(fila incompleta)") + ": " + motivo);
return;
}

j.age = Number(j.age);
nuevos.push(j);
});

// Se limpia el input, para poder volver a importar el mismo archivo si hace falta.
evento.target.value = "";

await insertarImportados(nuevos, saltadas);
};
lector.readAsText(archivo);
}

// ---------- MENU DEL BOTON "CARGAR ARCHIVO" ----------

// Muestra u oculta el menu con las opciones "Desde .txt" / "Desde JSON".
function alternarMenuCargar(evento)
{
evento.stopPropagation();
let menu = document.querySelector("#menuCargar");
menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

// ---------- CARGAR JUGADORES DESDE UN ARCHIVO .JSON ----------

// Se ejecuta cuando el usuario elige un archivo en "Desde JSON": lee el archivo
// y muestra una vista previa, sin aplicar todavia ninguna validacion ni cambio en Supabase.
function importarDesdeJson(evento)
{
let archivo = evento.target.files[0];
if (!archivo) return;

let lector = new FileReader();
lector.onload = function(e)
{
let datos;
try
{
datos = JSON.parse(e.target.result);
}
catch (error)
{
alert("El archivo no contiene un JSON valido.");
evento.target.value = "";
return;
}

if (!Array.isArray(datos))
{
alert("El JSON debe ser una lista de jugadores (un array).");
evento.target.value = "";
return;
}

// Se guarda temporalmente: solo se usa de verdad si el usuario confirma en la vista previa.
datosJsonPendientes = datos;
document.querySelector("#contenidoPreviewJson").textContent = JSON.stringify(datos, null, 2);
document.querySelector("#modalPreviewJson").style.display = "flex";
document.querySelector("#fondoModalJson").style.display = "block";

evento.target.value = "";
};
lector.readAsText(archivo);
}

// Cierra la vista previa de JSON sin importar nada.
function cancelarImportarJson()
{
datosJsonPendientes = null;
document.querySelector("#modalPreviewJson").style.display = "none";
document.querySelector("#fondoModalJson").style.display = "none";
}

// Devuelve el primer valor que exista entre dos nombres de campo, como texto sin espacios.
function campo(item, nombreA, nombreB)
{
if (!item) return "";
let valor = (item[nombreA] !== undefined && item[nombreA] !== null) ? item[nombreA] : item[nombreB];
return (valor === undefined || valor === null) ? "" : String(valor).trim();
}

// Se ejecuta al confirmar en la vista previa: aqui se validan los datos y se insertan en Supabase.
// Acepta tanto el formato de la pagina (numero, name...) como el de la tabla (identificacion, nombre...).
async function confirmarImportarJson()
{
if (!datosJsonPendientes)
{
cancelarImportarJson();
return;
}

let nuevos = [];
let saltadas = [];

datosJsonPendientes.forEach(function(item)
{
let j = {
"numero": campo(item, "numero", "identificacion"),
"name": campo(item, "name", "nombre"),
"nationality": campo(item, "nationality", "nacionalidad"),
"position": campo(item, "position", "posicion"),
"age": campo(item, "age", "edad"),
"equipo": campo(item, "equipo", "equipo") || EQUIPO_POR_DEFECTO
};

let motivo = validarJugadorImportado(j, nuevos);
if (motivo)
{
saltadas.push((j.name || "(sin nombre)") + ": " + motivo);
return;
}

j.age = Number(j.age);
nuevos.push(j);
});

cancelarImportarJson();
await insertarImportados(nuevos, saltadas);
}

// ---------- EXPORTAR JUGADORES ----------

// Descarga el array PLAYERS actual como un archivo .txt, pero con el contenido
// interno en formato JSON (JSON.stringify con sangria), no en el formato de comas.
function exportarJugadores()
{
let contenido = JSON.stringify(PLAYERS, null, 2);
let blob = new Blob([contenido], { type: "text/plain" });
let url = URL.createObjectURL(blob);

let enlace = document.createElement("a");
enlace.href = url;
enlace.download = "jugadores_barcelona.txt";
document.body.appendChild(enlace);
enlace.click();
document.body.removeChild(enlace);
URL.revokeObjectURL(url);
}

// ---------- VER JSON EN PANTALLA ----------

// Abre la ventana con el array PLAYERS actual en formato JSON (con sangria).
function mostrarJson()
{
document.querySelector("#contenidoVerJson").textContent = JSON.stringify(PLAYERS, null, 2);
document.querySelector("#modalVerJson").style.display = "flex";
document.querySelector("#fondoModalVerJson").style.display = "block";
}

// Cierra la ventana del JSON.
function cerrarJson()
{
document.querySelector("#modalVerJson").style.display = "none";
document.querySelector("#fondoModalVerJson").style.display = "none";
}

// Copia el JSON al portapapeles. Si el navegador no permite la API moderna,
// usa un textarea oculto como respaldo.
function copiarJson()
{
let texto = JSON.stringify(PLAYERS, null, 2);

if (navigator.clipboard && window.isSecureContext)
{
navigator.clipboard.writeText(texto)
.then(function(){ alert("JSON copiado al portapapeles."); })
.catch(function(){ copiarJsonRespaldo(texto); });
}
else
{
copiarJsonRespaldo(texto);
}
}

function copiarJsonRespaldo(texto)
{
let area = document.createElement("textarea");
area.value = texto;
area.style.position = "fixed";
area.style.opacity = "0";
document.body.appendChild(area);
area.select();
try
{
document.execCommand("copy");
alert("JSON copiado al portapapeles.");
}
catch (error)
{
alert("No se pudo copiar automaticamente. Selecciona el texto y copialo manualmente.");
}
document.body.removeChild(area);
}

// Descarga el JSON como archivo .json real (a diferencia de "Exportar", que genera .txt).
function descargarJson()
{
let contenido = JSON.stringify(PLAYERS, null, 2);
let blob = new Blob([contenido], { type: "application/json" });
let url = URL.createObjectURL(blob);

let enlace = document.createElement("a");
enlace.href = url;
enlace.download = "jugadores_barcelona.json";
document.body.appendChild(enlace);
enlace.click();
document.body.removeChild(enlace);
URL.revokeObjectURL(url);
}

// Busca el nombre en ingles de un pais escrito en espanol, para preguntarle a la API.
function traducirPais(nombre)
{
let clave = nombre.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
return TRADUCCIONES_PAIS[clave] || nombre;
}

// Busca la bandera de un pais en la API countries.dev (gratis, sin clave, con cache).
function obtenerBandera(nacionalidad)
{
if (banderaCache[nacionalidad] !== undefined) return Promise.resolve(banderaCache[nacionalidad]);

return fetch("https://countries.dev/name/" + encodeURIComponent(traducirPais(nacionalidad)))
.then(function(resp){ return resp.ok ? resp.json() : null; })
.then(function(datos)
{
let url = (datos && datos[0] && datos[0].flags) ? datos[0].flags.png : null;
banderaCache[nacionalidad] = url;
return url;
})
.catch(function(){ banderaCache[nacionalidad] = null; return null; });
}

// Pone la bandera (o el nombre del pais, si la API no la encontro) en cada celda de nacionalidad.
function actualizarBanderasEnPantalla()
{
document.querySelectorAll(".celdaNacionalidad").forEach(function(celda)
{
let nacionalidad = celda.dataset.nacionalidad;
obtenerBandera(nacionalidad).then(function(url)
{
celda.innerHTML = url
? "<img src='" + url + "' title='" + nacionalidad + "' style='height:22px; border-radius:3px;'>"
: "<span title='" + nacionalidad + "'>" + nacionalidad + "</span>";
});
});
}

// Dibuja la tabla, aplicando el filtro de posicion, el texto de busqueda,
// y ordenando siempre Portero -> Defensa -> Mediocampista -> Delantero.
function buildTable()
{
let textoBusqueda = document.querySelector("#buscador").value.toLowerCase();

// Primero se arma la lista de filas que coinciden, guardando su indice REAL en PLAYERS.
// Primero se filtra solo por posicion (pestana), y se ordena, para poder asignar
// el ID ANTES de aplicar la busqueda de texto.
let filasPorPosicion = [];
for (let i = 0; i < PLAYERS.length; i++)
{
let j = PLAYERS[i];
let coincidePosicion = (filtroPosicionActual === "Todas" || j.position === filtroPosicionActual);
if (coincidePosicion)
{
filasPorPosicion.push({ indiceReal: i, jugador: j });
}
}

// Se ordena siempre igual, sin importar el orden en que se cargaron los jugadores.
filasPorPosicion.sort(function(a, b)
{
return ORDEN_POSICIONES.indexOf(a.jugador.position) - ORDEN_POSICIONES.indexOf(b.jugador.position);
});

// Se asigna el ID segun ese orden (el mismo que se va a mostrar en pantalla).
filasPorPosicion.forEach(function(item, indice)
{
item.id = indice + 1;
});

// Ahora si se filtra por el texto de busqueda, comparando tambien contra el ID.
let filasCoincidentes = filasPorPosicion.filter(function(item)
{
let j = item.jugador;
let textoCompleto = (item.id + " " + j.numero + " " + j.name + " " + j.nationality).toLowerCase();
return textoCompleto.includes(textoBusqueda);
});

let htmlString = "<table>";
htmlString += "<tr><th>ID</th><th>Nro De Jugador</th><th>Foto</th><th>Nombre</th><th>Posicion</th><th>Nacionalidad</th><th>Edad</th><th>Acciones</th></tr>";

filasCoincidentes.forEach(function(item, posicionEnTabla)
{
let i = item.indiceReal;
let j = item.jugador;

// Si esta fila es la seleccionada, se le agrega la clase "seleccionada".
let claseFila = (i === filaSeleccionada) ? " class='seleccionada'" : "";

// El nombre del archivo de foto sigue la misma regla que en Tachira.
let nombreArchivo = j.numero + "_" + j.name.toLowerCase().replace(/\s+/g, "_") + ".png";

htmlString += "<tr" + claseFila + " onclick='seleccionarFila(" + i + ")'>";
htmlString += "<td>" + item.id + "</td>";
htmlString += "<td>" + j.numero + "</td>";
htmlString += "<td>" +
"<img class='fotoFila' src='fotos/" + nombreArchivo + "' " +
"onerror=\"this.outerHTML='<div class=circuloNumeroFila>" + j.numero + "</div>'\">" +
"</td>";
htmlString += "<td>" + j.name + "</td>";
htmlString += "<td>" + j.position + "</td>";
htmlString += "<td class='celdaNacionalidad' data-nacionalidad='" + j.nationality + "'></td>";
htmlString += "<td>" + j.age + "</td>";
// event.stopPropagation() evita que al usar estos botones tambien se seleccione la fila.
htmlString += "<td>" +
"<button class='btnIcono' onclick='event.stopPropagation(); editarJugador(" + i + ")'>&#9998;</button>" +
"<button class='btnIcono' onclick='event.stopPropagation(); eliminarJugador(" + i + ")'>&#128465;</button>" +
"</td>";
htmlString += "</tr>";
});

// Si no hay ninguna coincidencia, se muestra un aviso en vez de una tabla vacia.
if (filasCoincidentes.length === 0)
{
htmlString += "<tr><td colspan='8'>Aun no hay jugadores cargados</td></tr>";
}

htmlString += "</table>";
document.querySelector("#theTable").innerHTML = htmlString;

document.querySelector("#contadorJugadoresNumero").innerText = PLAYERS.length;

actualizarBanderasEnPantalla();
}
</script>
